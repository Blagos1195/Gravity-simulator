name: Godot checks

on:
  push:
    branches:
      - main
    paths:
      - "Gravity/**"
      - ".github/workflows/godot-tests.yml"
  pull_request:
    paths:
      - "Gravity/**"
      - ".github/workflows/godot-tests.yml"
  workflow_dispatch:

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.7.0
          use-dotnet: false
          include-templates: false
      - name: Import and parse project
        run: |
          output="$(godot --headless --path Gravity --editor --quit 2>&1)" || { echo "$output"; exit 1; }
          echo "$output"
          if echo "$output" | grep -Eq 'SCRIPT ERROR|Parse Error|Failed to load script|ERROR: [0-9]+ resources still in use'; then
            exit 1
          fi
      - name: Run focused pull request checks
        if: github.event_name == 'pull_request'
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          git fetch origin "$BASE_REF"
          changed_files="$(git diff --name-only "origin/$BASE_REF...HEAD")"
          run_check() {
            output="$(godot --headless --path Gravity --script "res://tests/$1.gd" --quit-after 1 2>&1)" || { echo "$output"; exit 1; }
            echo "$output"
            if echo "$output" | grep -Eq 'SCRIPT ERROR|Parse Error|Failed to load script'; then
              exit 1
            fi
          }
          run_check compile_simulation_view
          if echo "$changed_files" | grep -Eq 'rocket_design|content_catalog'; then
            run_check rocket_design_test
          fi
          if echo "$changed_files" | grep -Eq 'rocket_assembly|main.gd|content_catalog'; then
            run_check rocket_assembly_test
          fi
          if echo "$changed_files" | grep -Eq 'main.gd'; then
            run_check rocket_builder_ui_test
          fi
          if echo "$changed_files" | grep -Eq 'main.gd|simulation_view|space_object_physics|rocket_design'; then
            run_check multi_vehicle_test
            run_check docking_fuel_test
            run_check spacecraft_collision_test
          fi
          if echo "$changed_files" | grep -Eq 'simulation_view|rocket_design|rocket_visual'; then
            run_check booster_physics_test
          fi
          if echo "$changed_files" | grep -Eq 'simulation_view|rocket_visual'; then
            run_check rocket_visual_scale_test
          fi
          if echo "$changed_files" | grep -Eq 'simulation_view|planetary_system'; then
            run_check simulation_lifecycle_test
          fi
          if echo "$changed_files" | grep -Eq 'orbital_propagator'; then
            run_check orbital_propagator_test
          fi
          if echo "$changed_files" | grep -Eq 'space_discovery|content_catalog|rocket_design'; then
            run_check space_discovery_test
          fi
          if echo "$changed_files" | grep -Eq 'main.gd|rocket_design|content_catalog'; then
            run_check career_economy_test
          fi
          if echo "$changed_files" | grep -Eq 'mission_system|content_catalog|main.gd'; then
            run_check mission_system_test
          fi
          if echo "$changed_files" | grep -Eq 'flight_computer|route_planner'; then
            run_check flight_computer_test
            run_check leo_autopilot_mission_test
            run_check body_agnostic_orbit_test
          fi
          if echo "$changed_files" | grep -Eq 'planetary_system'; then
            run_check orbital_stability_test
            run_check body_agnostic_orbit_test
          fi
      - name: Run full regression suite
        if: github.event_name != 'pull_request'
        run: |
          run_check() {
            output="$(godot --headless --path Gravity --script "res://tests/$1.gd" --quit-after 1 2>&1)" || { echo "$output"; exit 1; }
            echo "$output"
            if echo "$output" | grep -Eq 'SCRIPT ERROR|Parse Error|Failed to load script|ERROR: [0-9]+ resources still in use'; then
              exit 1
            fi
          }
          run_check compile_simulation_view
          run_check orbital_propagator_test
          run_check space_discovery_test
          run_check career_economy_test
          run_check mission_system_test
          run_check rocket_design_test
          run_check rocket_assembly_test
          run_check rocket_builder_ui_test
          run_check booster_physics_test
          run_check rocket_visual_scale_test
          run_check multi_vehicle_test
          run_check docking_fuel_test
          run_check spacecraft_collision_test
          run_check flight_computer_test
          run_check orbital_stability_test
          run_check simulation_lifecycle_test
          run_check leo_autopilot_mission_test
          run_check body_agnostic_orbit_test
