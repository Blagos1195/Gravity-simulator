name: Godot checks

on:
  push:
    paths:
      - "Gravity/**"
      - ".github/workflows/godot-tests.yml"
  pull_request:
    paths:
      - "Gravity/**"
      - ".github/workflows/godot-tests.yml"
  workflow_dispatch:

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.7.0
          use-dotnet: false
          include-templates: false
      - name: Import and parse project
        run: |
          run_check() {
            local output
            output="$(godot "$@" 2>&1)" || { printf '%s\n' "$output"; return 1; }
            printf '%s\n' "$output"
            if printf '%s\n' "$output" | grep -Eq 'SCRIPT ERROR|Parse Error|Failed to load script'; then
              return 1
            fi
          }
          run_check --headless --path Gravity --editor --quit
          run_check --headless --path Gravity --script res://tests/compile_simulation_view.gd --quit-after 1
          run_check --headless --path Gravity --script res://tests/rocket_design_test.gd --quit-after 1
          run_check --headless --path Gravity --script res://tests/flight_computer_test.gd --quit-after 1
          run_check --headless --path Gravity --script res://tests/orbital_stability_test.gd --quit-after 1
