name: Godot checks

on:
  push:
    paths:
      - "Gravity/**"
      - ".github/workflows/godot-tests.yml"
  pull_request:
    paths:
      - "Gravity/**"
      - ".github/workflows/godot-tests.yml"
  workflow_dispatch:

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.7.0
          use-dotnet: false
          include-templates: false
      - name: Import and parse project
        run: godot --headless --path Gravity --editor --quit
      - name: Test rocket design validation
        run: godot --headless --path Gravity --script res://tests/rocket_design_test.gd
      - name: Test flight computer calculations
        run: godot --headless --path Gravity --script res://tests/flight_computer_test.gd
